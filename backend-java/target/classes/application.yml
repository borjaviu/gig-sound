spring:
  application:
    name: gig-sound-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:database}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8000

logging:
  level:
    com.gigsound: INFO
    org.hibernate.SQL: WARN
